<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thor Companion</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --container-bg: #1c1c24;
            --primary: #00d2ff;
            --text-main: #e0e0e0;
            --border-color: #333;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
        }

        #thor-screen {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1080 / 1240;
            background-color: var(--container-bg);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: #15151a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex: 1;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        /* Vistas */
        #view-folders, #view-game { display: none; flex-direction: column; height: 100%; }
        #view-folders.active, #view-game.active { display: flex; }

        /* Estilos de Carpetas */
        .folder-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .folder-item {
            background-color: #252530;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .folder-item:hover { border-color: var(--primary); }
        .folder-name { font-size: 1.1rem; font-weight: bold; }
        
        .btn {
            background-color: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: all 0.2s;
        }
        .btn:active { background-color: var(--primary); color: #000; }
        .btn-danger { color: var(--danger); border-color: var(--danger); background: none; padding: 5px 10px; }

        /* Estilos de Juego Individual */
        .section-title { margin: 10px 0; font-size: 1rem; color: #aaa; display: flex; justify-content: space-between;}
        .status { font-size: 0.8rem; color: #4caf50; opacity: 0; transition: opacity 0.3s ease; }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #252530;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        textarea:focus { border-color: var(--primary); }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .image-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-img {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 71, 87, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="thor-screen">
        <header>
            <button class="back-btn" id="btn-back">◀ Volver</button>
            <h1 id="header-title">Juegos</h1>
            <div style="width: 60px;"></div> <!-- Spacer para centrar el título -->
        </header>

        <main>
            <!-- VISTA 1: Lista de Carpetas -->
            <div id="view-folders" class="active">
                <div class="folder-list" id="folder-list">
                    <!-- Las carpetas se generan por JS -->
                </div>
                <button class="btn" id="btn-new-game">+ Nuevo Juego</button>
            </div>

            <!-- VISTA 2: Detalles del Juego (Notas e Imágenes) -->
            <div id="view-game">
                <div class="section-title">
                    <span>Bloc de Notas</span>
                    <span id="save-status" class="status">Guardado</span>
                </div>
                <textarea id="notepad" placeholder="Apunta contraseñas, rutas..."></textarea>
                
                <div class="section-title">
                    <span>Imágenes y Mapas</span>
                </div>
                <button class="btn" id="btn-add-img">📸 Añadir Imagen</button>
                <input type="file" id="file-input" accept="image/*">
                
                <div class="image-gallery" id="image-gallery">
                    <!-- Imágenes se generan por JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- Estado de la App ---
        let appData = JSON.parse(localStorage.getItem('thor_data')) || { games: [] };
        let currentGameId = null;
        let typingTimer;

        // --- Elementos del DOM ---
        const viewFolders = document.getElementById('view-folders');
        const viewGame = document.getElementById('view-game');
        const folderList = document.getElementById('folder-list');
        const btnNewGame = document.getElementById('btn-new-game');
        const btnBack = document.getElementById('btn-back');
        const headerTitle = document.getElementById('header-title');
        
        const notepad = document.getElementById('notepad');
        const saveStatus = document.getElementById('save-status');
        const btnAddImg = document.getElementById('btn-add-img');
        const fileInput = document.getElementById('file-input');
        const imageGallery = document.getElementById('image-gallery');

        // --- Funciones Principales ---
        function saveData() {
            try {
                localStorage.setItem('thor_data', JSON.stringify(appData));
                saveStatus.style.opacity = '1';
                setTimeout(() => saveStatus.style.opacity = '0', 2000);
            } catch (e) {
                alert("Límite de memoria alcanzado. Borra alguna imagen para guardar más.");
            }
        }

        function renderFolders() {
            folderList.innerHTML = '';
            appData.games.forEach(game => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `
                    <span class="folder-name">${game.name}</span>
                    <button class="btn-danger" onclick="deleteGame(${game.id}, event)">X</button>
                `;
                div.onclick = () => openGame(game.id);
                folderList.appendChild(div);
            });
        }

        function openGame(id) {
            currentGameId = id;
            const game = appData.games.find(g => g.id === id);
            
            headerTitle.textContent = game.name;
            notepad.value = game.notes || '';
            renderImages();

            viewFolders.classList.remove('active');
            viewGame.classList.add('active');
            btnBack.style.display = 'block';
        }

        function closeGame() {
            currentGameId = null;
            headerTitle.textContent = 'Juegos';
            viewGame.classList.remove('active');
            viewFolders.classList.add('active');
            btnBack.style.display = 'none';
            renderFolders();
        }

        function renderImages() {
            imageGallery.innerHTML = '';
            const game = appData.games.find(g => g.id === currentGameId);
            if (!game.images) game.images = [];
            
            game.images.forEach((imgData, index) => {
                const div = document.createElement('div');
                div.className = 'image-card';
                div.innerHTML = `
                    <img src="${imgData}" alt="Map/Screenshot">
                    <button class="delete-img" onclick="deleteImage(${index})">X</button>
                `;
                imageGallery.appendChild(div);
            });
        }

        // --- Eventos ---
        btnNewGame.onclick = () => {
            const name = prompt("Nombre del juego (ej: Metroid Fusion):");
            if (name && name.trim() !== '') {
                appData.games.push({ id: Date.now(), name, notes: '', images: [] });
                saveData();
                renderFolders();
            }
        };

        btnBack.onclick = closeGame;

        window.deleteGame = (id, event) => {
            event.stopPropagation(); // Evita entrar a la carpeta
            if(confirm("¿Borrar este juego y todas sus notas/imágenes?")) {
                appData.games = appData.games.filter(g => g.id !== id);
                saveData();
                renderFolders();
            }
        };

        window.deleteImage = (index) => {
            if(confirm("¿Borrar imagen?")) {
                const game = appData.games.find(g => g.id === currentGameId);
                game.images.splice(index, 1);
                saveData();
                renderImages();
            }
        };

        // Autoguardado de notas
        notepad.addEventListener('input', () => {
            clearTimeout(typingTimer);
            saveStatus.style.opacity = '0';
            typingTimer = setTimeout(() => {
                const game = appData.games.find(g => g.id === currentGameId);
                if (game) {
                    game.notes = notepad.value;
                    saveData();
                }
            }, 800);
        });

        // Subida y compresión de imágenes
        btnAddImg.onclick = () => fileInput.click();

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Comprimir imagen para no saturar el LocalStorage
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Resolución ideal para Thor
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6); // 60% calidad
                    
                    const game = appData.games.find(g => g.id === currentGameId);
                    if(!game.images) game.images = [];
                    game.images.push(compressedDataUrl);
                    
                    saveData();
                    renderImages();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = ''; // Resetear input
        });

        // Iniciar
        renderFolders();
    </script>
</body>
</html>
