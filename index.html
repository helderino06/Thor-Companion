<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thor Companion</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --container-bg: #1c1c24;
            --primary: #00d2ff;
            --text-main: #e0e0e0;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
        }

        #thor-screen {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1080 / 1240;
            background-color: var(--container-bg);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #15151a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .notes-header h2 {
            font-size: 1.1rem;
            color: #fff;
        }

        .status {
            font-size: 0.8rem;
            color: #4caf50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        textarea {
            flex: 1;
            width: 100%;
            background-color: #252530;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        nav {
            display: flex;
            background-color: #15151a;
            border-top: 1px solid var(--border-color);
        }

        .nav-btn {
            flex: 1;
            padding: 15px 0;
            background: none;
            border: none;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }

        .nav-btn.active {
            color: var(--primary);
            background-color: rgba(0, 210, 255, 0.1);
            border-top: 2px solid var(--primary);
        }
    </style>
</head>
<body>

    <div id="thor-screen">
        <header>
            <h1>Thor Companion</h1>
        </header>

        <main id="view-notes">
            <div class="notes-header">
                <h2>Bloc de Guardado</h2>
                <span id="save-status" class="status">Autoguardado...</span>
            </div>
            <textarea id="notepad" placeholder="Apunta aquí passwords, códigos de taquillas de Resident Evil o qué ruta tomaste en el mapa..."></textarea>
        </main>

        <nav>
            <button class="nav-btn active">Notas</button>
            <button class="nav-btn">Mapas (Próximamente)</button>
            <button class="nav-btn">Timer (Próximamente)</button>
        </nav>
    </div>

    <script>
        const notepad = document.getElementById('notepad');
        const saveStatus = document.getElementById('save-status');
        let typingTimer;
        const doneTypingInterval = 800; // Guarda 800ms después de dejar de escribir

        // 1. Cargar notas guardadas
        window.onload = () => {
            const savedNotes = localStorage.getItem('thor_notes');
            if (savedNotes) {
                notepad.value = savedNotes;
            }
        };

        // 2. Lógica de autoguardado al escribir
        notepad.addEventListener('input', () => {
            clearTimeout(typingTimer);
            saveStatus.style.opacity = '0'; // Oculta el mensaje
            
            typingTimer = setTimeout(() => {
                localStorage.setItem('thor_notes', notepad.value);
                
                saveStatus.style.opacity = '1';
                setTimeout(() => {
                    saveStatus.style.opacity = '0';
                }, 2000);
            }, doneTypingInterval);
        });
    </script>
</body>
</html>
