<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thor Companion</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --container-bg: #1c1c24;
            --primary: #00d2ff;
            --text-main: #e0e0e0;
            --border-color: #333;
            --danger: #ff4757;
            --secondary: #9b59b6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            overflow: hidden; /* Evitar scroll en el body por el modal */
        }

        #thor-screen {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1080 / 1240;
            background-color: var(--container-bg);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: #15151a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex: 1;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* Vistas */
        #view-folders, #view-game { display: none; flex-direction: column; height: 100%; }
        #view-folders.active, #view-game.active { display: flex; }

        /* Estilos de Carpetas */
        .folder-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .folder-item {
            background-color: #252530;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .folder-item:hover { border-color: var(--primary); }
        .folder-name { font-size: 1.1rem; font-weight: bold; }
        
        .btn {
            background-color: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: all 0.2s;
            flex: 1;
        }
        .btn:active { background-color: var(--primary); color: #000; }
        
        .btn-secondary {
            color: var(--secondary);
            border-color: var(--secondary);
            background-color: rgba(155, 89, 182, 0.1);
        }
        .btn-secondary:active { background-color: var(--secondary); color: #fff; }

        .btn-danger { color: var(--danger); border-color: var(--danger); background: none; padding: 5px 10px; }

        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Estilos de Juego Individual */
        .section-title { margin: 10px 0; font-size: 1rem; color: #aaa; display: flex; justify-content: space-between;}
        .status { font-size: 0.8rem; color: #4caf50; opacity: 0; transition: opacity 0.3s ease; }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #252530;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        textarea:focus { border-color: var(--primary); }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .image-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-img {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 71, 87, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
            z-index: 2;
        }

        input[type="file"] { display: none; }

        /* Visor de Mapas Modal */
        #zoom-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Desactiva acciones del navegador para gestos manuales */
        }

        #zoom-img-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: 0 0;
        }

        #zoom-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none; /* Delegar eventos al contenedor */
        }

        .modal-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 101;
            background: rgba(30, 30, 40, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .modal-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .modal-btn:active { background: rgba(255,255,255,0.2); }
        .modal-close { color: var(--danger); }
    </style>
</head>
<body>

    <div id="thor-screen">
        <header>
            <button class="back-btn" id="btn-back">◀ Volver</button>
            <h1 id="header-title">Juegos</h1>
            <div style="width: 60px;"></div>
        </header>

        <main>
            <!-- VISTA 1: Lista de Carpetas -->
            <div id="view-folders" class="active">
                <div class="folder-list" id="folder-list"></div>
                <button class="btn" id="btn-new-game">+ Nuevo Juego</button>
            </div>

            <!-- VISTA 2: Detalles del Juego -->
            <div id="view-game">
                <div class="section-title">
                    <span>Bloc de Notas</span>
                    <span id="save-status" class="status">Guardado</span>
                </div>
                <textarea id="notepad" placeholder="Apunta contraseñas, rutas..."></textarea>
                
                <div class="section-title">
                    <span>Imágenes y Mapas</span>
                </div>
                <div class="action-row">
                    <button class="btn" id="btn-add-img">📸 Subir</button>
                    <button class="btn btn-secondary" id="btn-search-map">🔍 Buscar Mapas</button>
                </div>
                <input type="file" id="file-input" accept="image/*">
                
                <div class="image-gallery" id="image-gallery"></div>
            </div>
        </main>

        <!-- VISOR DE MAPAS FULLSCREEN -->
        <div id="zoom-modal">
            <div id="zoom-img-container">
                <img id="zoom-img" src="" alt="Zoom Map">
            </div>
            <div class="modal-controls">
                <button class="modal-btn" id="btn-zoom-out">➖</button>
                <button class="modal-btn modal-close" id="btn-zoom-close">✖</button>
                <button class="modal-btn" id="btn-zoom-in">➕</button>
            </div>
        </div>
    </div>

    <script>
        // --- Estado de la App ---
        let appData = JSON.parse(localStorage.getItem('thor_data')) || { games: [] };
        let currentGameId = null;
        let typingTimer;

        // --- Elementos DOM ---
        const viewFolders = document.getElementById('view-folders');
        const viewGame = document.getElementById('view-game');
        const folderList = document.getElementById('folder-list');
        const headerTitle = document.getElementById('header-title');
        
        // --- Lógica Principal ---
        function saveData() {
            try {
                localStorage.setItem('thor_data', JSON.stringify(appData));
                document.getElementById('save-status').style.opacity = '1';
                setTimeout(() => document.getElementById('save-status').style.opacity = '0', 2000);
            } catch (e) {
                alert("Límite de memoria alcanzado. Borra alguna imagen.");
            }
        }

        function renderFolders() {
            folderList.innerHTML = '';
            appData.games.forEach(game => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `
                    <span class="folder-name">${game.name}</span>
                    <button class="btn-danger" onclick="deleteGame(${game.id}, event)">X</button>
                `;
                div.onclick = () => openGame(game.id);
                folderList.appendChild(div);
            });
        }

        function openGame(id) {
            currentGameId = id;
            const game = appData.games.find(g => g.id === id);
            headerTitle.textContent = game.name;
            document.getElementById('notepad').value = game.notes || '';
            renderImages();
            viewFolders.classList.remove('active');
            viewGame.classList.add('active');
            document.getElementById('btn-back').style.display = 'block';
        }

        document.getElementById('btn-back').onclick = () => {
            currentGameId = null;
            headerTitle.textContent = 'Juegos';
            viewGame.classList.remove('active');
            viewFolders.classList.add('active');
            document.getElementById('btn-back').style.display = 'none';
            renderFolders();
        };

        document.getElementById('btn-new-game').onclick = () => {
            const name = prompt("Nombre del juego:");
            if (name && name.trim() !== '') {
                appData.games.push({ id: Date.now(), name, notes: '', images: [] });
                saveData(); renderFolders();
            }
        };

        window.deleteGame = (id, event) => {
            event.stopPropagation();
            if(confirm("¿Borrar juego y todas sus notas/imágenes?")) {
                appData.games = appData.games.filter(g => g.id !== id);
                saveData(); renderFolders();
            }
        };

        // Búsqueda de Mapas en Google
        document.getElementById('btn-search-map').onclick = () => {
            const game = appData.games.find(g => g.id === currentGameId);
            if(game) {
                const query = encodeURIComponent(game.name + " overworld map");
                window.open('https://www.google.com/search?tbm=isch&q=' + query, '_blank');
            }
        };

        // --- Gestión de Imágenes ---
        function renderImages() {
            const gallery = document.getElementById('image-gallery');
            gallery.innerHTML = '';
            const game = appData.games.find(g => g.id === currentGameId);
            if (!game.images) game.images = [];
            
            game.images.forEach((imgData, index) => {
                const div = document.createElement('div');
                div.className = 'image-card';
                div.onclick = () => openViewer(imgData);
                div.innerHTML = `
                    <img src="${imgData}" alt="Map">
                    <button class="delete-img" onclick="deleteImage(${index}, event)">X</button>
                `;
                gallery.appendChild(div);
            });
        }

        window.deleteImage = (index, event) => {
            event.stopPropagation();
            if(confirm("¿Borrar imagen?")) {
                const game = appData.games.find(g => g.id === currentGameId);
                game.images.splice(index, 1);
                saveData(); renderImages();
            }
        };

        document.getElementById('btn-add-img').onclick = () => document.getElementById('file-input').click();
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const game = appData.games.find(g => g.id === currentGameId);
                    if(!game.images) game.images = [];
                    game.images.push(canvas.toDataURL('image/jpeg', 0.7));
                    saveData(); renderImages();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            this.value = '';
        });

        document.getElementById('notepad').addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            document.getElementById('save-status').style.opacity = '0';
            typingTimer = setTimeout(() => {
                const game = appData.games.find(g => g.id === currentGameId);
                if (game) { game.notes = e.target.value; saveData(); }
            }, 800);
        });

        // --- VISOR DE MAPAS (Pan & Zoom) ---
        const modal = document.getElementById('zoom-modal');
        const container = document.getElementById('zoom-img-container');
        const zoomImg = document.getElementById('zoom-img');
        
        let scale = 1;
        let pointX = 0, pointY = 0;
        let start = { x: 0, y: 0 };
        let panning = false;

        function openViewer(src) {
            zoomImg.src = src;
            modal.style.display = 'flex';
            scale = 1; pointX = 0; pointY = 0;
            updateTransform();
        }

        function closeViewer() { modal.style.display = 'none'; }
        document.getElementById('btn-zoom-close').onclick = closeViewer;

        function updateTransform() {
            container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        document.getElementById('btn-zoom-in').onclick = () => { scale *= 1.3; updateTransform(); };
        document.getElementById('btn-zoom-out').onclick = () => { scale /= 1.3; updateTransform(); };

        // Eventos táctiles para arrastrar (Pan)
        modal.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY };
                panning = true;
            }
        });
        modal.addEventListener('touchend', () => { panning = false; });
        modal.addEventListener('touchmove', (e) => {
            if (!panning || e.touches.length !== 1) return;
            pointX = e.touches[0].clientX - start.x;
            pointY = e.touches[0].clientY - start.y;
            updateTransform();
        });

        // Eventos de ratón para PC/Pruebas
        modal.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                start = { x: e.clientX - pointX, y: e.clientY - pointY };
                panning = true;
            }
        });
        modal.addEventListener('mouseup', () => { panning = false; });
        modal.addEventListener('mousemove', (e) => {
            if (!panning) return;
            pointX = e.clientX - start.x;
            pointY = e.clientY - start.y;
            updateTransform();
        });

        renderFolders();
    </script>
</body>
</html>
